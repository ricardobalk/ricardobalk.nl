services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.devcontainer
      args:
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        no_proxy: ${no_proxy:-${NO_PROXY:-}}
    init: true
    depends_on:
      - node
    volumes:
      - ./:/home/node/app/
      - node_modules:/home/node/app/node_modules/:ro
      - nuxt:/home/node/app/.nuxt/:ro
