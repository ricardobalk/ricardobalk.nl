name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  NUXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1
      - run: npm install --global corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:native
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm generate
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target production --tag website:ci .
