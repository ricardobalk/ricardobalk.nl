name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  NUXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1
      - run: npm install --global corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:native
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm generate
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target production --tag website:ci .
      - run: docker build --file .devcontainer/Dockerfile.nuxt --target development --tag website:nuxt-dev-ci .
      - name: Reach Nuxt from the editor with empty volumes and no registry access
        run: |
          docker compose -f .devcontainer/docker-compose.yml -f - up -d --build <<'YAML'
          networks:
            default:
              internal: true
          YAML
          docker compose -f .devcontainer/docker-compose.yml exec -T devcontainer \
            curl --noproxy '*' --fail --silent --show-error --output /dev/null \
              --retry 30 --retry-all-errors --retry-delay 2 --max-time 10 http://node:3000/
      - name: Check that the editor has no host engine socket
        run: |
          docker compose -f .devcontainer/docker-compose.yml exec -T -u vscode devcontainer sh -ec '
            test -z "${DOCKER_HOST+x}"
            test ! -e /var/run/docker.sock
            test ! -e /tmp/editor-docker.sock
          '
