version: '3.8'
services:
  ricardobalk-website:
    extends:
        file: docker-compose.dev.yml
        service: ricardobalk-website
    build:
      target: production
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - NUXT_TELEMETRY_DISABLED=1
      - DO_NOT_TRACK=1
    volumes:
      - ./:/home/node/app/
      - node_modules:/home/node/app/node_modules/
volumes:
  node_modules: {}
