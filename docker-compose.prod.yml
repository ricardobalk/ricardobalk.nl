services:
  ricardobalk-website:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        no_proxy: ${no_proxy:-${NO_PROXY:-}}
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - NUXT_TELEMETRY_DISABLED=1
      - DO_NOT_TRACK=1
    volumes:
      - ./:/home/node/app/
      - node_modules:/home/node/app/node_modules/
volumes:
  node_modules: {}
