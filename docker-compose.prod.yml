services:
  traefik:
    extends:
      file: docker-compose.traefik.yml
      service: traefik
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS: "true"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: r4do-web
      TRAEFIK_PROVIDERS_DOCKER_CONSTRAINTS: "Label(`do.r4.router`, `r4do-web`)"
    ports:
      - "80:80"
      - "443:443"

  docker-api:
    extends:
      file: docker-compose.traefik.yml
      service: docker-api

  ricardobalk-website:
    extends:
      file: docker-compose.frontend.yml
      service: ricardobalk-website

networks:
  default:
    name: r4do-web
  discovery:
    internal: true
